            build_base="$base"
            if [ "$PATCH" != 3.12.16 ]; then
              build_base="$(python -B -m scripts.release_qualification.first_stable_host "$TARGET" 3.12.16 "$root/first-stable-build-native")"
            fi
            UV_PROJECT_ENVIRONMENT="$root/first-stable-builder" "$uv" sync --project release-qualification-build --locked --no-dev --no-install-project --no-build --no-config --no-python-downloads --link-mode copy --python "$build_base"
          fi
          printf 'TASK_ROOT=%s\nUV_CACHE_DIR=%s\nUV_BIN=%s\nBASE_PYTHON=%s\nTOOLS_PYTHON=%s\n' "$root" "$UV_CACHE_DIR" "$uv" "$base" "$root/first-stable-tools/bin/python" >> "$GITHUB_ENV"
      - name: Obtain exact-attempt GitHub metadata
        timeout-minutes: 2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -m 700 "$TASK_ROOT/first-stable-evidence"
          cd "$TASK_ROOT/first-stable-evidence"
          ulimit -f 512
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/package-qualification.yml" > workflow.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > artifacts.json
      - name: Download the independently carried original pair
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/first-stable-evidence/inputs
          merge-multiple: true
          digest-mismatch: error
      - name: Download the sixteen independently carried row artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: "${{ needs.minimum-linux-312-wheel.outputs.artifact-id }},${{ needs.minimum-linux-312-sdist.outputs.artifact-id }},${{ needs.minimum-linux-313-wheel.outputs.artifact-id }},${{ needs.minimum-linux-313-sdist.outputs.artifact-id }},${{ needs.minimum-mac-312-wheel.outputs.artifact-id }},${{ needs.minimum-mac-312-sdist.outputs.artifact-id }},${{ needs.minimum-mac-313-wheel.outputs.artifact-id }},${{ needs.minimum-mac-313-sdist.outputs.artifact-id }},${{ needs.current-linux-312-wheel.outputs.artifact-id }},${{ needs.current-linux-312-sdist.outputs.artifact-id }},${{ needs.current-linux-313-wheel.outputs.artifact-id }},${{ needs.current-linux-313-sdist.outputs.artifact-id }},${{ needs.current-mac-312-wheel.outputs.artifact-id }},${{ needs.current-mac-312-sdist.outputs.artifact-id }},${{ needs.current-mac-313-wheel.outputs.artifact-id }},${{ needs.current-mac-313-sdist.outputs.artifact-id }}"
          path: ${{ runner.temp }}/first-stable-evidence/rows
          merge-multiple: false
          digest-mismatch: error
      - name: Cross-check all sixteen receipts and retained job identity
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          "$TOOLS_PYTHON" -B -m scripts.release_qualification.first_stable_aggregate "$TASK_ROOT/first-stable-evidence"
      - name: Preserve aggregate (not release authorization)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: first-stable-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/first-stable-evidence/aggregate.json
          if-no-files-found: error
          retention-days: 14

