    outputs: *row_outputs
    steps: *row_steps


  aggregate:
    name: Verify first-stable exact-attempt receipts
    needs: [admit, build, minimum-linux-312-wheel, minimum-linux-312-sdist, minimum-linux-313-wheel, minimum-linux-313-sdist, minimum-mac-312-wheel, minimum-mac-312-sdist, minimum-mac-313-wheel, minimum-mac-313-sdist, current-linux-312-wheel, current-linux-312-sdist, current-linux-313-wheel, current-linux-313-sdist, current-mac-312-wheel, current-mac-312-sdist, current-mac-313-wheel, current-mac-313-sdist]
