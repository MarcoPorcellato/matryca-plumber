name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Sync Python dependencies
        run: uv sync --locked --extra dev

      - name: Version consistency (pyproject.toml vs llms.txt)
        run: uv run python scripts/check_version_consistency.py

      - name: Frontend quality gate
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

      - name: Run CI gate
        run: make ci

  release:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build verified release archives from a clean source snapshot
        run: make release-build

      - name: Extract release notes from CHANGELOG
        run: |
          uv run python scripts/extract_changelog.py "${GITHUB_REF_NAME}" > release_notes.md
          echo "--- Release notes preview ---"
          head -n 40 release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_args=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create \
            "${GITHUB_REF_NAME}" \
            dist/* \
            --notes-file release_notes.md \
            "${release_args[@]}"

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
