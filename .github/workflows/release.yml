name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Sync Python dependencies
        run: uv sync --locked --extra dev

      - name: Version consistency (pyproject.toml vs llms.txt)
        run: uv run python scripts/check_version_consistency.py

      - name: Frontend quality gate
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

      - name: Run CI gate
        run: make ci

  release:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Setup Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React cockpit
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build sdist and wheel
        run: uv build

      - name: Verify distribution archives exclude compiled Python artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if not wheels or not sdists:
              sys.exit("Both a wheel and source distribution are required in dist/.")
          archives = [*wheels, *sdists]

          forbidden = []
          for archive in archives:
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as bundle:
                      members = bundle.namelist()
              else:
                  with tarfile.open(archive, "r:gz") as bundle:
                      members = bundle.getnames()

              forbidden.extend(
                  f"{archive}: {member}"
                  for member in members
                  if "__pycache__" in Path(member).parts
                  or Path(member).suffix in {".pyc", ".pyo", ".pyd"}
              )

          if forbidden:
              sys.exit(
                  "Compiled Python artifacts are not permitted in release archives:\n"
                  + "\n".join(forbidden)
              )
          PY

      - name: Extract release notes from CHANGELOG
        run: |
          uv run python scripts/extract_changelog.py "${GITHUB_REF_NAME}" > release_notes.md
          echo "--- Release notes preview ---"
          head -n 40 release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --notes-file release_notes.md

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
