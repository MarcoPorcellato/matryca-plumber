name: Commit CI Preflight Receipt Observation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  statuses: write

concurrency:
  group: commit-ci-preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CCP_EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha }}
  CCP_STATUS_CONTEXT: commit-ci-preflight/receipt
  CCP_SOURCE_COMMIT: 866db18a571f55ed3d9b481d6c9c9c3bd5e98d55

jobs:
  receipt:
    name: Observe exact-head local receipt
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'ci:observe-local-receipt')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Publish pending status on the exact pull-request commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CCP_EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CCP_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${CCP_EXPECTED_COMMIT}" \
            -f state=pending \
            -f context="$CCP_STATUS_CONTEXT" \
            -f description="Local receipt verification started" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null

      - name: Check out the adopting repository trusted base
        id: trusted
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-repository
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Check out the pinned CCP verifier source
        id: verifier_source
        if: steps.trusted.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: MarcoPorcellato/commit-ci-preflight
          ref: ${{ env.CCP_SOURCE_COMMIT }}
          path: verifier
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Retrieve the commit-bound evidence branch
        id: evidence
        if: steps.verifier_source.outcome == 'success'
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ccp-evidence/${{ github.event.pull_request.head.sha }}
          path: evidence
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout: |
            .ccp/receipt.json
          sparse-checkout-cone-mode: false

      - name: Build only the pinned trusted Rust verifier
        id: build
        if: steps.evidence.outcome == 'success'
        continue-on-error: true
        working-directory: verifier
        run: cargo build --locked --release --bin commit-ci-preflight

      - name: Verify receipt integrity and adopting-repository policy
        id: verify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          verifier/scripts/github-receipt-gate.sh \
            verifier/target/release/commit-ci-preflight \
            evidence/.ccp/receipt.json \
            trusted-repository/.commit-ci-policy.toml \
            "$CCP_EXPECTED_COMMIT"

      - name: Publish final commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_OUTCOME: ${{ steps.trusted.outcome }}
          VERIFIER_SOURCE_OUTCOME: ${{ steps.verifier_source.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          state=failure
          description="Receipt missing or verification failed"
          if [[ "$TRUSTED_OUTCOME" == "success" &&
                "$VERIFIER_SOURCE_OUTCOME" == "success" &&
                "$EVIDENCE_OUTCOME" == "success" &&
                "$BUILD_OUTCOME" == "success" &&
                "$VERIFY_OUTCOME" == "success" ]]; then
            state=success
            description="Commit-bound local receipt accepted"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${CCP_EXPECTED_COMMIT}" \
            -f state="$state" \
            -f context="$CCP_STATUS_CONTEXT" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            >/dev/null
          [[ "$state" == "success" ]]
