          test "$(git rev-parse HEAD)" = "$SELECTED_SOURCE"
          test -z "$(git status --porcelain --untracked-files=all)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$SELECTED_SOURCE" = "$GITHUB_SHA"
            git merge-base --is-ancestor HEAD origin/main
          fi
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: false
      - name: Provision explicit qualification interpreters
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: manual
        run: uv python install 3.12 "${RUNTIME_MINOR:-3.12}"
      - name: Provision locked qualification tools
        shell: bash
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/tools" uv sync --locked --extra dev --no-install-project --no-config --no-python-downloads --link-mode copy
      - name: Require native refusal before graph access
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/Scripts/python.exe" -B scripts/qualify_release_package.py alpha-windows-refusal --source-root "$GITHUB_WORKSPACE" --expected-commit "$SELECTED_SOURCE" --python "$RUNNER_TEMP/tools/Scripts/python.exe" --output "$RUNNER_TEMP/windows-results/windows.json"
      - name: Preserve windows-refusal evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: og-alpha-${{ github.run_id }}-${{ github.run_attempt }}-windows-refusal
          path: ${{ runner.temp }}/windows-results
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


  linux312:
    name: OG linux-x64 Python 3.12
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-sha256: ${{ steps.upload.outputs.artifact-digest }}
    env:
      RUNTIME_MINOR: "3.12"
      EXPECTED_BINDING_JSON: ${{ needs.build.outputs.binding }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
