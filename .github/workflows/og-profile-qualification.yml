name: OG alpha qualification

on:
  pull_request:
    paths:
      - .github/workflows/og-profile-qualification.yml
      - scripts/release_qualification/**
      - scripts/qualify_release_package.py
      - scripts/build_release_artifacts.py
      - matryca_plumber/**
      - src/**
      - contracts/**
      - release-qualification-build/**
      - pyproject.toml
      - uv.lock
      - MANIFEST.in
      - setup.py
      - frontend/**
      - tests/test_release_package_*.py
      - tests/test_build_release_artifacts.py
      - tests/test_og_macos_cleanup_stress.py
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Separately authorized protected-main full source SHA"
        type: string
        required: true

permissions: {}

env:
  SELECTED_SOURCE: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
  PYTHONDONTWRITEBYTECODE: "1"
  UV_NO_CONFIG: "1"
  UV_PYTHON_DOWNLOADS: never
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: og-alpha-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.source_sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build OG alpha
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-sha256: ${{ steps.upload.outputs.artifact-digest }}
      binding: ${{ steps.build.outputs.binding_json }}
      build-json: ${{ steps.build.outputs.build_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify selected source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SELECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SELECTED_SOURCE"
          test -z "$(git status --porcelain --untracked-files=all)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$SELECTED_SOURCE" = "$GITHUB_SHA"
            git merge-base --is-ancestor HEAD origin/main
          fi
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: false
      - name: Provision explicit qualification interpreters
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: manual
        run: uv python install 3.12 "${RUNTIME_MINOR:-3.12}"
      - name: Provision locked qualification tools
        shell: bash
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/tools" uv sync --locked --extra dev --no-install-project --no-config --no-python-downloads --link-mode copy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Provision independent canonical build environment
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/canonical-build" uv sync --project release-qualification-build --locked --no-install-project --python "$(uv python find --no-python-downloads 3.12)" --no-config --no-python-downloads --link-mode copy
      - name: Build one canonical artifact pair
        id: build
        timeout-minutes: 15
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/bin/python" -B scripts/qualify_release_package.py alpha-build --source-root "$GITHUB_WORKSPACE" --dist-dir "$RUNNER_TEMP/bundle/dist" --expected-commit "$SELECTED_SOURCE" --build-python "$RUNNER_TEMP/canonical-build/bin/python" --uv "$(command -v uv)"
      - name: Preserve build evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: og-alpha-${{ github.run_id }}-${{ github.run_attempt }}-build
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


  source-controls:
    name: Source OG controls
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-sha256: ${{ steps.upload.outputs.artifact-digest }}
    env:
      EXPECTED_BINDING_JSON: ${{ needs.build.outputs.binding }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify selected source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SELECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SELECTED_SOURCE"
          test -z "$(git status --porcelain --untracked-files=all)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$SELECTED_SOURCE" = "$GITHUB_SHA"
            git merge-base --is-ancestor HEAD origin/main
          fi
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: false
      - name: Provision explicit qualification interpreters
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: manual
        run: uv python install 3.12 "${RUNTIME_MINOR:-3.12}"
      - name: Provision locked qualification tools
        shell: bash
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/tools" uv sync --locked --extra dev --no-install-project --no-config --no-python-downloads --link-mode copy
      - name: Download independently bound canonical artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/bundle
          merge-multiple: true
          digest-mismatch: error
      - name: Run mapped exact-source negative controls
        timeout-minutes: 16
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/bin/python" -B scripts/qualify_release_package.py alpha-source-controls --source-root "$GITHUB_WORKSPACE" --dist-dir "$RUNNER_TEMP/bundle/dist" --python "$RUNNER_TEMP/tools/bin/python" --work "$RUNNER_TEMP/source-controls-work" --output "$RUNNER_TEMP/source-results/source.json"
      - name: Preserve source-controls evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: og-alpha-${{ github.run_id }}-${{ github.run_attempt }}-source-controls
          path: ${{ runner.temp }}/source-results
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


  windows-refusal:
    name: Windows OG refusal
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-sha256: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify selected source
        shell: bash
        run: |
          set -euo pipefail
