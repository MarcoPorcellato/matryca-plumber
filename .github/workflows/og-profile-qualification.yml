        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: manual
        run: uv python install 3.12 "${RUNTIME_MINOR:-3.12}"
      - name: Provision locked qualification tools
        shell: bash
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/tools" uv sync --locked --extra dev --no-install-project --no-config --no-python-downloads --link-mode copy
      - name: Download independently bound canonical artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/bundle
          merge-multiple: true
          digest-mismatch: error
      - name: Provision separate locked runtime and build environments
        run: |
          set -euo pipefail
          runtime="$(uv python find --no-python-downloads "$RUNTIME_MINOR")"
          for kind in wheel sdist; do
            uv venv --no-config --no-python-downloads --python "$runtime" "$RUNNER_TEMP/runtime-$kind"
            uv pip install --no-config --no-python-downloads --python "$RUNNER_TEMP/runtime-$kind/bin/python" --require-hashes --only-binary :all: --link-mode copy -r "$GITHUB_WORKSPACE/matryca_plumber/graph_gateway/resources/og-v1/requirements-og-v1-parser-1.9.0.txt"
          done
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/sdist-build" uv sync --project release-qualification-build --locked --no-install-project --python "$(uv python find --no-python-downloads 3.12)" --no-config --no-python-downloads --link-mode copy
      - name: Verify original wheel and original-sdist installation paths
        timeout-minutes: 25
        run: |
          set -euo pipefail
          for kind in wheel sdist; do
            "$RUNNER_TEMP/tools/bin/python" -B scripts/qualify_release_package.py alpha-row --source-root "$GITHUB_WORKSPACE" --dist-dir "$RUNNER_TEMP/bundle/dist" --python "$RUNNER_TEMP/runtime-$kind/bin/python" --build-python "$RUNNER_TEMP/sdist-build/bin/python" --uv "$(command -v uv)" --minor "$RUNTIME_MINOR" --kind "$kind" --work "$RUNNER_TEMP/row-work-$kind" --output "$RUNNER_TEMP/row-results/$kind.json"
          done
      - name: Stress owned macOS cleanup
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/cleanup-stress-results"
          "$RUNNER_TEMP/runtime-wheel/bin/python" -I -B -c 'import importlib,pathlib,sys; root=pathlib.Path.cwd().resolve(); sys.path.insert(0,str(root)); names=("src","matryca_plumber"); modules=[importlib.import_module(name) for name in names]; assert all(pathlib.Path(module.__file__).resolve()==root/module.__name__/"__init__.py" and module.__spec__.origin==str(root/module.__name__/"__init__.py") for module in modules); from tests.test_og_macos_cleanup_stress import main; raise SystemExit(main())' --work "$RUNNER_TEMP/cleanup-stress-work" --output "$RUNNER_TEMP/cleanup-stress-results/report.json" --iterations 200
      - name: Preserve cleanup stress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: og-cleanup-stress-${{ github.run_id }}-${{ github.run_attempt }}-macos313
          path: ${{ runner.temp }}/cleanup-stress-results
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve macos313 evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: og-alpha-${{ github.run_id }}-${{ github.run_attempt }}-macos313
          path: ${{ runner.temp }}/row-results
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


  aggregate:
    name: Aggregate OG alpha
    if: always()
    needs: [build, source-controls, windows-refusal, linux312, linux313, macos312, macos313]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      EXPECTED_BINDING_JSON: ${{ needs.build.outputs.binding }}
      EXPECTED_BUILD_JSON: ${{ needs.build.outputs.build-json }}
      EXPECTED_ARTIFACTS_JSON: '{"build":{"id":"${{ needs.build.outputs.artifact-id }}","sha256":"${{ needs.build.outputs.artifact-sha256 }}"},"source-controls":{"id":"${{ needs.source-controls.outputs.artifact-id }}","sha256":"${{ needs.source-controls.outputs.artifact-sha256 }}"},"windows-refusal":{"id":"${{ needs.windows-refusal.outputs.artifact-id }}","sha256":"${{ needs.windows-refusal.outputs.artifact-sha256 }}"},"linux312":{"id":"${{ needs.linux312.outputs.artifact-id }}","sha256":"${{ needs.linux312.outputs.artifact-sha256 }}"},"linux313":{"id":"${{ needs.linux313.outputs.artifact-id }}","sha256":"${{ needs.linux313.outputs.artifact-sha256 }}"},"macos312":{"id":"${{ needs.macos312.outputs.artifact-id }}","sha256":"${{ needs.macos312.outputs.artifact-sha256 }}"},"macos313":{"id":"${{ needs.macos313.outputs.artifact-id }}","sha256":"${{ needs.macos313.outputs.artifact-sha256 }}"}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify selected source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SELECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SELECTED_SOURCE"
          test -z "$(git status --porcelain --untracked-files=all)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$SELECTED_SOURCE" = "$GITHUB_SHA"
            git merge-base --is-ancestor HEAD origin/main
          fi
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: false
      - name: Provision explicit qualification interpreters
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: manual
        run: uv python install 3.12 "${RUNTIME_MINOR:-3.12}"
      - name: Provision locked qualification tools
        shell: bash
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/tools" uv sync --locked --extra dev --no-install-project --no-config --no-python-downloads --link-mode copy
      - name: Require actual upstream jobs and retained artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/bin/python" -c 'import json,os; value=json.loads(os.environ["NEEDS_JSON"]); assert len(value)==7 and all(job["result"]=="success" for job in value.values())'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
      - name: Download only the seven independently carried artifact IDs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: "${{ needs.build.outputs.artifact-id }},${{ needs.source-controls.outputs.artifact-id }},${{ needs.windows-refusal.outputs.artifact-id }},${{ needs.linux312.outputs.artifact-id }},${{ needs.linux313.outputs.artifact-id }},${{ needs.macos312.outputs.artifact-id }},${{ needs.macos313.outputs.artifact-id }}"
          path: ${{ runner.temp }}/downloaded
          merge-multiple: false
          digest-mismatch: error
      - name: Fail-closed alpha aggregation
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/bin/python" -B scripts/qualify_release_package.py alpha-aggregate --source-root "$GITHUB_WORKSPACE" --receipt-dir "$RUNNER_TEMP/downloaded" --jobs "$RUNNER_TEMP/jobs.json" --artifacts "$RUNNER_TEMP/artifacts.json" --output "$RUNNER_TEMP/alpha-aggregate.json"
      - name: Preserve aggregate (not a release or consumer admission)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: og-alpha-${{ github.run_id }}-${{ github.run_attempt }}-aggregate
          path: ${{ runner.temp }}/alpha-aggregate.json
          if-no-files-found: error
          retention-days: 14
