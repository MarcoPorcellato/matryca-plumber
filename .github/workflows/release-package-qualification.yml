name: Release package qualification

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full lowercase 40-character commit SHA on protected main
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-source:
    name: Verify exact main source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_tree: ${{ steps.source.outputs.source_tree }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Validate manual dispatch identity
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"

      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false

      - name: Verify clean source, tree, and release version
        id: source
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=all)"
          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          test "$(git write-tree)" = "$SOURCE_TREE"
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [[ "$VERSION" =~ ^2\.0\.1rc[0-9]+$ ]]
          {
            echo "source_sha=$EXPECTED_COMMIT"
            echo "source_tree=$SOURCE_TREE"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  build-bundle:
    name: Build and bind one package pair
    needs: verify-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      binding_json: ${{ steps.build.outputs.binding_json }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      source_tree: ${{ needs.verify-source.outputs.source_tree }}
    steps:
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          persist-credentials: false

      - name: Recheck clean source identity
        env:
          EXPECTED_COMMIT: ${{ needs.verify-source.outputs.source_sha }}
          EXPECTED_TREE: ${{ needs.verify-source.outputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install locked Python and Node toolchains
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          python-version: "3.12"
          version: "0.12.19"

      - name: Verify official uv 0.12.19 Linux binary
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://releases.astral.sh/github/uv/releases/download/0.12.19/uv-x86_64-unknown-linux-gnu.tar.gz \
            -o "$archive"
          # Upstream checksum: https://releases.astral.sh/github/uv/releases/download/0.12.19/uv-x86_64-unknown-linux-gnu.tar.gz.sha256
          printf '%s  %s\n' \
            23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8 \
            "$archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/verified-uv"
          tar -xzf "$archive" -C "$RUNNER_TEMP/verified-uv"
          verified="$RUNNER_TEMP/verified-uv/uv-x86_64-unknown-linux-gnu/uv"
          cmp "$verified" "$(command -v uv)"
          echo "verified uv 0.12.19 sha256=$(shasum -a 256 "$verified" | awk '{print $1}')"

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - name: Install locked build dependencies
        env:
          EXPECTED_UV_VERSION: "0.12.19"
        run: |
          set -euo pipefail
          test "$(uv --version | awk '{print $2}')" = "$EXPECTED_UV_VERSION"
          echo "uv=$EXPECTED_UV_VERSION sha256=$(shasum -a 256 "$(command -v uv)" | awk '{print $1}')"
          echo "node=$(node --version) npm=$(npm --version) python=$(python --version)"
          uv sync --locked --extra dev

      - name: Build and verify one bound package pair
        id: build
        env:
          EXPECTED_COMMIT: ${{ needs.verify-source.outputs.source_sha }}
        run: |
          set -euo pipefail
          # The qualification CLI invokes the release builder exactly once; its
          # --ledger path is outside dist and binds generated frontend content.
          uv run python scripts/qualify_release_package.py build-handoff \
            --repo-root "$GITHUB_WORKSPACE" \
            --dist-dir "$GITHUB_WORKSPACE/dist" \
            --ledger "$RUNNER_TEMP/release-content-ledger.json" \
            --expected-commit "$EXPECTED_COMMIT"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = 1
          test -s dist/SHA256SUMS

      - name: Upload immutable package bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-bundle-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Require artifact handoff identity
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]

  platform-qualification:
    name: Installed package qualification (${{ matrix.os }}/${{ matrix.architecture }})
    needs: build-bundle
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-24.04
            os: linux
            architecture: x64
            focused_platform: linux
          - runs-on: macos-15
            os: macos
            architecture: arm64
            focused_platform: macos
          - runs-on: windows-2022
            os: windows
            architecture: x64
            focused_platform: windows
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false

      - name: Recheck selected source identity
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_TREE: ${{ needs.build-bundle.outputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install locked Python 3.12 toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          python-version: "3.12"
          version: "0.12.19"

      - name: Verify official uv 0.12.19 runner binary
        id: verify-uv
        env:
          EXPECTED_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          # Expected SHA-256 values are from the immutable upstream release page
          # and adjacent checksums, never calculated from downloaded assets:
          # https://github.com/astral-sh/uv/releases/tag/0.12.19
          # https://releases.astral.sh/github/uv/releases/download/0.12.19/uv-aarch64-apple-darwin.tar.gz.sha256
          # https://releases.astral.sh/github/uv/releases/download/0.12.19/uv-x86_64-unknown-linux-gnu.tar.gz.sha256
          # https://releases.astral.sh/github/uv/releases/download/0.12.19/uv-x86_64-pc-windows-msvc.zip.sha256
          python - <<'PY'
          import hashlib
          import os
          import shutil
          import tarfile
          import urllib.request
          import zipfile
          from pathlib import Path

          assets = {
              "macos": (
                  "uv-aarch64-apple-darwin.tar.gz",
                  "a9a8df1eedeb192f2e47e40e2faabfb387db4b850209118786d42f89dde3e0ba",
                  "uv-aarch64-apple-darwin/uv",
                  64 * 1024 * 1024,
              ),
              "windows": (
                  "uv-x86_64-pc-windows-msvc.zip",
                  "6dbb02d79e419522f1c500f0adb1cddcff0cda7d59b0d66ea7f5e3b4a1b2f5f0",
                  "uv-x86_64-pc-windows-msvc/uv.exe",
                  64 * 1024 * 1024,
              ),
              "linux": (
                  "uv-x86_64-unknown-linux-gnu.tar.gz",
                  "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8",
                  "uv-x86_64-unknown-linux-gnu/uv",
                  64 * 1024 * 1024,
              ),
          }
          try:
              asset, expected_sha256, binary_path, max_bytes = assets[os.environ["EXPECTED_OS"]]
          except KeyError as error:
              raise SystemExit("Unsupported runner for verified uv release.") from error

          archive = Path(os.environ["RUNNER_TEMP"]) / asset
          url = f"https://releases.astral.sh/github/uv/releases/download/0.12.19/{asset}"
          with urllib.request.urlopen(url, timeout=90) as response:
              advertised_size = response.headers.get("Content-Length")
              if advertised_size is not None and int(advertised_size) > max_bytes:
                  raise SystemExit("Official uv release archive exceeds its configured size cap.")
              digest = hashlib.sha256()
              total_bytes = 0
              with archive.open("xb") as output:
                  while chunk := response.read(64 * 1024):
                      total_bytes += len(chunk)
                      if total_bytes > max_bytes:
                          raise SystemExit("Official uv release archive exceeds its configured size cap.")
                      digest.update(chunk)
                      output.write(chunk)
          if total_bytes == 0 or digest.hexdigest() != expected_sha256:
              raise SystemExit("Downloaded uv release archive does not match the official digest.")

          destination = Path(os.environ["RUNNER_TEMP"]) / "verified-uv"
          destination.mkdir(parents=True, exist_ok=True)
          if asset.endswith(".zip"):
              with zipfile.ZipFile(archive) as bundle:
                  bundle.extractall(destination)
          else:
              with tarfile.open(archive, "r:gz") as bundle:
                  bundle.extractall(destination, filter="data")
          verified = destination / binary_path
          active_name = shutil.which("uv")
          if active_name is None:
              raise SystemExit("setup-uv did not provide an active uv executable.")
          verified_bytes = verified.read_bytes()
          if verified_bytes != Path(active_name).read_bytes():
              raise SystemExit("setup-uv executable differs from the verified official release asset.")
          verified_sha256 = hashlib.sha256(verified_bytes).hexdigest()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"uv_path={verified}\n")
              output.write(f"uv_sha256={verified_sha256}\n")
          print(f"verified uv 0.12.19 sha256={verified_sha256}")
          PY

      - name: Check actual runner operating system and architecture
        env:
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import platform
          import sys

          expected_os = os.environ["EXPECTED_OS"]
          expected_architecture = os.environ["EXPECTED_ARCHITECTURE"]
          actual_os = {"Linux": "linux", "Darwin": "macos", "Windows": "windows"}.get(platform.system())
          actual_architecture = {"AMD64": "x64", "x86_64": "x64", "arm64": "arm64", "aarch64": "arm64"}.get(platform.machine())
          if actual_os != expected_os or actual_architecture != expected_architecture:
              raise SystemExit("Runner OS or architecture does not match the required matrix row.")
          print(f"qualified runner row: {actual_os}/{actual_architecture}")
          PY

      - name: Enforce Windows launcher NO-GO boundary
        if: matrix.os == 'windows'
        run: |
          set -euo pipefail
          echo "::error::Generated Windows launcher identity has no admitted archive-derived byte proof; this required Windows row is NO-GO."
          exit 1

      - name: Install locked qualification dependencies
        env:
          EXPECTED_UV_VERSION: "0.12.19"
        run: |
          set -euo pipefail
          UV_VERSION="$(uv --version)"
          test "${UV_VERSION#uv }" = "$EXPECTED_UV_VERSION"
          python -c 'import sys; print("python=" + sys.version.split()[0])'
          uv sync --locked --extra dev

      - name: Download exact build artifact by ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-bundle.outputs.artifact_id }}
          path: dist

      - name: Verify downloaded package handoff before installation
        env:
          EXPECTED_BINDING_JSON: ${{ needs.build-bundle.outputs.binding_json }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          distribution = Path("dist")
          files = tuple(distribution.iterdir())
          if len(files) != 3 or any(path.is_symlink() or not path.is_file() for path in files):
              raise SystemExit("Downloaded artifact does not contain exactly three regular files.")
          if sum(path.suffix == ".whl" for path in files) != 1:
              raise SystemExit("Downloaded artifact does not contain exactly one wheel.")
          if sum(path.name.endswith(".tar.gz") for path in files) != 1:
              raise SystemExit("Downloaded artifact does not contain exactly one source archive.")
          if sum(path.name == "SHA256SUMS" for path in files) != 1:
              raise SystemExit("Downloaded artifact is missing its handoff manifest.")
          PY
          uv run --no-sync python scripts/qualify_release_package.py verify-handoff \
            --dist-dir "$GITHUB_WORKSPACE/dist" \
            --manifest "$GITHUB_WORKSPACE/dist/SHA256SUMS"

      - name: Create two isolated installation environments
        id: environments
        run: |
          set -euo pipefail
          uv venv --python 3.12 "$RUNNER_TEMP/wheel-env"
          uv venv --python 3.12 "$RUNNER_TEMP/sdist-env"
          python - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          executable = "Scripts/python.exe" if os.name == "nt" else "bin/python"
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"wheel_python={root / 'wheel-env' / executable}\n")
              handle.write(f"sdist_python={root / 'sdist-env' / executable}\n")
          PY

      - name: Export locked runtime requirements
        run: uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/runtime-requirements.txt"

      - name: Install and verify the bound wheel
        id: wheel
        env:
          EXPECTED_BINDING_JSON: ${{ needs.build-bundle.outputs.binding_json }}
          WHEEL_PYTHON: ${{ steps.environments.outputs.wheel_python }}
        run: |
          set -euo pipefail
          WHEEL="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL"
          uv pip install --python "$WHEEL_PYTHON" --no-deps --requirement "$RUNNER_TEMP/runtime-requirements.txt"
          uv pip install --python "$WHEEL_PYTHON" --no-deps "$WHEEL"
          uv run --locked python scripts/qualify_release_package.py verify-installed \
            --python "$WHEEL_PYTHON" --source-root "$GITHUB_WORKSPACE" \
            --artifact "$GITHUB_WORKSPACE/$WHEEL" --kind wheel \
            > "$RUNNER_TEMP/wheel-receipt.json"

      - name: Build temporary wheel from authenticated sdist
        id: sdist-build
        env:
          EXPECTED_BINDING_JSON: ${{ needs.build-bundle.outputs.binding_json }}
          SDIST_PYTHON: ${{ steps.environments.outputs.sdist_python }}
          VERIFIED_UV_PATH: ${{ steps.verify-uv.outputs.uv_path }}
          VERIFIED_UV_SHA256: ${{ steps.verify-uv.outputs.uv_sha256 }}
        run: |
          set -euo pipefail
          SDIST="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$SDIST"
          WHEEL_OUTPUT="$RUNNER_TEMP/sdist-wheel-output"
          test ! -e "$WHEEL_OUTPUT"
          mkdir -m 700 "$WHEEL_OUTPUT"
          test -d "$WHEEL_OUTPUT" && test -z "$(find "$WHEEL_OUTPUT" -mindepth 1 -maxdepth 1 -print -quit)"
          test -n "$VERIFIED_UV_PATH" && test -n "$VERIFIED_UV_SHA256"
          uv run --locked python scripts/qualify_release_package.py prepare-sdist-build \
            --artifact "$GITHUB_WORKSPACE/$SDIST" \
            --source-root "$GITHUB_WORKSPACE" \
            --python "$(command -v python)" \
            --uv "$VERIFIED_UV_PATH" \
            --uv-sha256 "$VERIFIED_UV_SHA256" \
            --wheel-output "$WHEEL_OUTPUT" \
            > "$RUNNER_TEMP/sdist-build-receipt.json"
          test -s "$RUNNER_TEMP/sdist-build-receipt.json"

      - name: Install and verify the bound source distribution
        id: sdist
        env:
          EXPECTED_BINDING_JSON: ${{ needs.build-bundle.outputs.binding_json }}
          SDIST_PYTHON: ${{ steps.environments.outputs.sdist_python }}
          SDIST_BUILD_RECEIPT: ${{ runner.temp }}/sdist-build-receipt.json
          SDIST_WHEEL_OUTPUT: ${{ runner.temp }}/sdist-wheel-output
        run: |
          set -euo pipefail
          SDIST="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$SDIST"
          SDIST_TEMP_WHEEL="$(python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          binding = json.loads(os.environ["EXPECTED_BINDING_JSON"])
          receipt_path = Path(os.environ["SDIST_BUILD_RECEIPT"])
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          if not isinstance(receipt, dict):
              raise SystemExit("Temporary source-build receipt is malformed.")
          name = receipt.get("wheel_name")
          if (
              not isinstance(name, str)
              or name != binding.get("wheel_name")
              or Path(name).name != name
              or receipt.get("sdist_name") != binding.get("sdist_name")
              or receipt.get("sdist_size") != binding.get("sdist_size")
              or receipt.get("sdist_sha256") != binding.get("sdist_sha256")
              or receipt.get("source_commit") != binding.get("source_commit")
              or receipt.get("source_tree") != binding.get("source_tree")
              or receipt.get("binding_sha256")
              != hashlib.sha256(
                  json.dumps(binding, sort_keys=True, separators=(",", ":")).encode("utf-8")
              ).hexdigest()
          ):
              raise SystemExit("Temporary source-build receipt differs from the bound source archive.")
          wheel = Path(os.environ["SDIST_WHEEL_OUTPUT"]) / name
          if wheel.is_symlink() or not wheel.is_file():
              raise SystemExit("Temporary source-build wheel is not a regular file.")
          digest = hashlib.sha256()
          size = 0
          with wheel.open("rb") as stream:
              while chunk := stream.read(1024 * 1024):
                  size += len(chunk)
                  digest.update(chunk)
          if size != receipt.get("wheel_size") or digest.hexdigest() != receipt.get("wheel_sha256"):
              raise SystemExit("Temporary source-build wheel differs from its receipt.")
          print(wheel)
          PY
          )"
          test -n "$SDIST_TEMP_WHEEL"
          uv pip install --python "$SDIST_PYTHON" --no-deps --requirement "$RUNNER_TEMP/runtime-requirements.txt"
          uv pip install --python "$SDIST_PYTHON" --no-deps "$SDIST_TEMP_WHEEL"
          uv run --locked python scripts/qualify_release_package.py verify-installed \
            --python "$SDIST_PYTHON" --source-root "$GITHUB_WORKSPACE" \
            --artifact "$GITHUB_WORKSPACE/$SDIST" --kind sdist \
            > "$RUNNER_TEMP/sdist-receipt.json"

      - name: Require both isolated installs to match the lock-selected set
        env:
          WHEEL_PYTHON: ${{ steps.environments.outputs.wheel_python }}
          SDIST_PYTHON: ${{ steps.environments.outputs.sdist_python }}
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          import json
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          from packaging.markers import default_environment
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          requirement_file = Path(os.environ["RUNNER_TEMP"]) / "runtime-requirements.txt"
          expected = {}
          for raw_line in requirement_file.read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#") or line.startswith("--"):
                  continue
              line = line.removesuffix("\\").strip()
              requirement = Requirement(line)
              if requirement.marker is not None and not requirement.marker.evaluate(default_environment()):
                  continue
              if requirement.url is not None or len(requirement.specifier) != 1:
                  raise SystemExit("Exported lock requirements are not exact index versions.")
              specifier = next(iter(requirement.specifier))
              if specifier.operator != "==" or "*" in specifier.version:
                  raise SystemExit("Exported lock requirements are not exact versions.")
              name = canonicalize_name(requirement.name)
              if name in expected:
                  raise SystemExit("Exported lock requirements contain a duplicate package.")
              expected[name] = Version(specifier.version)

          project = tomllib.loads((Path.cwd() / "pyproject.toml").read_text(encoding="utf-8"))["project"]
          expected[canonicalize_name(project["name"])] = Version(project["version"])

          for label in ("WHEEL_PYTHON", "SDIST_PYTHON"):
              result = subprocess.run(
                  ["uv", "pip", "list", "--format", "json", "--python", os.environ[label]],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              installed_rows = json.loads(result.stdout)
              installed = {
                  canonicalize_name(row["name"]): Version(row["version"])
                  for row in installed_rows
              }
              if installed != expected:
                  raise SystemExit(f"{label} package set differs from the lock-selected runtime set.")
          print("Both isolated package sets exactly match the selected uv.lock runtime set.")
          PY

      - name: Run the frozen platform-focused source tests
        id: focused
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          FOCUSED_PLATFORM: ${{ matrix.focused_platform }}
        run: |
          set -euo pipefail
          uv run python scripts/qualify_release_package.py run-focused \
            --repo-root "$GITHUB_WORKSPACE" \
            --platform "$FOCUSED_PLATFORM" \
            --source-commit "$EXPECTED_COMMIT" \
            > "$RUNNER_TEMP/focused-receipt.json"

      - name: Write sanitized platform receipt with artifact-digest binding
        env:
          EXPECTED_BINDING_JSON: ${{ needs.build-bundle.outputs.binding_json }}
          ARTIFACT_ID: ${{ needs.build-bundle.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build-bundle.outputs.artifact_digest }}
          RUN_ID: ${{ github.run_id }}
          PLATFORM_OS: ${{ matrix.os }}
          PLATFORM_ARCHITECTURE: ${{ matrix.architecture }}
          UV_VERSION: "0.12.19"
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          binding = json.loads(os.environ["EXPECTED_BINDING_JSON"])
          temp = Path(os.environ["RUNNER_TEMP"])
          uv_binary = (
              temp / "verified-uv" / "uv-aarch64-apple-darwin" / "uv"
              if os.environ["PLATFORM_OS"] == "macos"
              else temp / "verified-uv" / "uv-x86_64-pc-windows-msvc" / "uv.exe"
              if os.environ["PLATFORM_OS"] == "windows"
              else temp / "verified-uv" / "uv-x86_64-unknown-linux-gnu" / "uv"
          )
          receipt = {
              "run_id": os.environ["RUN_ID"],
              "source_sha": binding["source_commit"],
              "source_tree": binding["source_tree"],
              "artifact_id": os.environ["ARTIFACT_ID"],
              "artifact_digest": os.environ["ARTIFACT_DIGEST"],
              "os": os.environ["PLATFORM_OS"],
              "architecture": os.environ["PLATFORM_ARCHITECTURE"],
              "lock_sha256": hashlib.sha256((Path.cwd() / "uv.lock").read_bytes()).hexdigest(),
              "uv": {
                  "version": os.environ["UV_VERSION"],
                  "sha256": hashlib.sha256(uv_binary.read_bytes()).hexdigest(),
              },
              "wheel": {
                  "name": binding["wheel_name"],
                  "size": binding["wheel_size"],
                  "sha256": binding["wheel_sha256"],
                  "inventory_sha256": binding["wheel_inventory_sha256"],
                  "installed": json.loads((temp / "wheel-receipt.json").read_text(encoding="utf-8")),
              },
              "sdist": {
                  "name": binding["sdist_name"],
                  "size": binding["sdist_size"],
                  "sha256": binding["sdist_sha256"],
                  "inventory_sha256": binding["sdist_inventory_sha256"],
                  "installed": json.loads((temp / "sdist-receipt.json").read_text(encoding="utf-8")),
              },
              "sdist_build": json.loads(
                  (temp / "sdist-build-receipt.json").read_text(encoding="utf-8")
              ),
              "focused": json.loads((temp / "focused-receipt.json").read_text(encoding="utf-8")),
          }
          receipt_path = Path(
              f"platform-receipt-{os.environ['PLATFORM_OS']}-{os.environ['PLATFORM_ARCHITECTURE']}.json"
          )
          receipt_path.write_text(
              json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload unique sanitized row receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-qualification-receipt-${{ github.run_id }}-${{ matrix.os }}-${{ matrix.architecture }}
          path: platform-receipt-${{ matrix.os }}-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 2

  qualification-gate:
    name: Require every source, build, and platform receipt
    needs:
      - verify-source
      - build-bundle
      - platform-qualification
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require all upstream jobs to succeed
        env:
          VERIFY_SOURCE_RESULT: ${{ needs.verify-source.result }}
          BUILD_BUNDLE_RESULT: ${{ needs.build-bundle.result }}
          PLATFORM_RESULT: ${{ needs.platform-qualification.result }}
        run: |
          set -euo pipefail
          test "$VERIFY_SOURCE_RESULT" = success
          test "$BUILD_BUNDLE_RESULT" = success
          test "$PLATFORM_RESULT" = success

      - name: Checkout selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          persist-credentials: false

      - name: Recheck exact source checkout
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install locked Python 3.12 toolchain
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
          python-version: "3.12"
          version: "0.12.19"

      - name: Verify official uv 0.12.19 receipt-gate binary
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://releases.astral.sh/github/uv/releases/download/0.12.19/uv-x86_64-unknown-linux-gnu.tar.gz \
            -o "$archive"
          # Upstream checksum: https://releases.astral.sh/github/uv/releases/download/0.12.19/uv-x86_64-unknown-linux-gnu.tar.gz.sha256
          printf '%s  %s\n' \
            23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8 \
            "$archive" | shasum -a 256 -c -
          verified_root="$RUNNER_TEMP/verified-receipt-gate-uv"
          mkdir -m 700 "$verified_root"
          tar -xzf "$archive" -C "$verified_root"
          verified="$verified_root/uv-x86_64-unknown-linux-gnu/uv"
          cmp "$verified" "$(command -v uv)"
          test "$(uv --version | awk '{print $2}')" = "0.12.19"

      - name: Install locked receipt-verifier dependencies
        run: uv sync --locked --extra dev

      - name: Download all unique platform receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-qualification-receipt-${{ github.run_id }}-*
          path: ${{ runner.temp }}/receipts
          merge-multiple: true

      - name: Verify exactly three bound platform receipts
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_TREE: ${{ needs.verify-source.outputs.source_tree }}
          EXPECTED_BINDING_JSON: ${{ needs.build-bundle.outputs.binding_json }}
          ARTIFACT_ID: ${{ needs.build-bundle.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.build-bundle.outputs.artifact_digest }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          uv run python scripts/qualify_release_package.py verify-receipts \
            --receipt-dir "$RUNNER_TEMP/receipts" \
            --expected-commit "$EXPECTED_COMMIT" \
            --expected-tree "$EXPECTED_TREE" \
            --expected-binding "$EXPECTED_BINDING_JSON" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --run-id "$RUN_ID" --expected-platform-count 3
