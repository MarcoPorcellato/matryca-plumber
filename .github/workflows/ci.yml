          def validate_origin(module, expected):
              file = getattr(module, "__file__", None)
              spec = getattr(module, "__spec__", None)
              origin = getattr(spec, "origin", None)
              if not isinstance(file, str) or not isinstance(origin, str):
                  raise RuntimeError("source origin is missing")
              if Path(file).resolve() != expected or Path(origin).resolve() != expected:
                  raise RuntimeError("source origin mismatch")

          def validate_case_ids(node_ids):
              if node_ids != EXPECTED_NODES or len(set(node_ids)) != 30:
                  raise RuntimeError("case inventory mismatch")

          def validate_reports(reports):
              if set(reports) != set(EXPECTED_NODES):
                  raise RuntimeError("case outcomes are incomplete")
              expected = [("setup", "passed", False), ("call", "passed", False), ("teardown", "passed", False)]
              if any(records != expected for records in reports.values()):
                  raise RuntimeError("case outcomes include failure, skip, xfail or duplicate")

          root = Path.cwd().resolve()
          selected = os.environ["SELECTED_HEAD"]
          workflow_sha = os.environ["WORKFLOW_SHA"]
          workflow_ref = os.environ["WORKFLOW_REF"]
          if not re.fullmatch(r"[0-9a-f]{40}", selected):
              raise RuntimeError("invalid selected head")
          if not re.fullmatch(r"[0-9a-f]{40}", workflow_sha):
              raise RuntimeError("invalid workflow identity")
          if not workflow_ref.startswith("MarcoPorcellato/matryca-plumber/.github/workflows/ci.yml@"):
              raise RuntimeError("unexpected workflow identity")
          if os.environ["SELECTED_BASE"] != "93889319f22dbc09e2896101001a1bf6ac9c5a0d":
              raise RuntimeError("base drift")
          if sys.flags.isolated != 1 or not sys.dont_write_bytecode:
              raise RuntimeError("unexpected interpreter flags")
          if (
              sys.version_info[:2] != (3, 12)
              or platform.python_implementation() != "CPython"
              or platform.system() != "Linux"
              or platform.machine() != "x86_64"
              or Path(sys.prefix).resolve() != root / ".venv"
          ):
              raise RuntimeError("unexpected diagnostic runtime")

          def git_metadata(*arguments):
              result = subprocess.run(
                  ["git", "--no-optional-locks", *arguments],
                  cwd=root,
                  stdin=subprocess.DEVNULL,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  timeout=10,
                  check=True,
              )
              if len(result.stdout) > 4096 or result.stderr:
                  raise RuntimeError("incomplete source identity")
              return result.stdout.decode("ascii").strip()

          head = git_metadata("rev-parse", "HEAD")
          tree = git_metadata("rev-parse", "HEAD^{tree}")
          if head != selected or git_metadata("rev-parse", "--show-toplevel") != str(root):
              raise RuntimeError("checkout identity mismatch")

          def selected_file_map():
              observed = {}
              for name, expected in EXPECTED_FILES.items():
                  path = root / name
                  if path.is_symlink() or not path.is_file() or path.stat().st_size > 2 * 1024 * 1024:
                      raise RuntimeError("selected source input rejected")
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  if digest != expected:
                      raise RuntimeError("selected source digest mismatch")
                  observed[name] = digest
              workflow = root / ".github/workflows/ci.yml"
              if workflow.is_symlink() or not workflow.is_file() or workflow.stat().st_size > 2 * 1024 * 1024:
                  raise RuntimeError("workflow input rejected")
              observed[".github/workflows/ci.yml"] = hashlib.sha256(workflow.read_bytes()).hexdigest()
              return observed

          observed_files = selected_file_map()
          parser_distribution = importlib.metadata.distribution("logseq-matryca-parser")
          if parser_distribution.version != "1.9.0" or importlib.metadata.version("pytest") != "9.0.3":
              raise RuntimeError("unqualified dependency metadata")
          parser_origin = Path(
              parser_distribution.locate_file("logseq_matryca_parser/__init__.py")
          ).resolve()
          if not parser_origin.is_file() or not parser_origin.is_relative_to(root / ".venv"):
              raise RuntimeError("unexpected Parser origin")
          parser_spec = importlib.machinery.PathFinder.find_spec("logseq_matryca_parser", sys.path)
          if parser_spec is None or parser_spec.origin is None:
              raise RuntimeError("Parser origin is missing")
          if Path(parser_spec.origin).resolve() != parser_origin:
              raise RuntimeError("Parser origin mismatch")

          sys.path.insert(0, str(root))
          source_modules = (
              ("src", "src/__init__.py", root),
              ("src.agent", "src/agent/__init__.py", root / "src"),
              (
                  "src.agent.og_parser_topology_adapter",
                  "src/agent/og_parser_topology_adapter.py",
                  root / "src/agent",
              ),
              ("matryca_plumber", "matryca_plumber/__init__.py", root),
              (
                  "matryca_plumber.graph_gateway",
                  "matryca_plumber/graph_gateway/__init__.py",
                  root / "matryca_plumber",
              ),
              (
                  "matryca_plumber.graph_gateway.bootstrap",
                  "matryca_plumber/graph_gateway/bootstrap.py",
                  root / "matryca_plumber/graph_gateway",
              ),
          )
          admitted_modules = []
          for name, relative, search in source_modules:
              expected = root / relative
              spec = importlib.machinery.PathFinder.find_spec(name, [str(search)])
              if spec is None or spec.origin is None or Path(spec.origin).resolve() != expected:
                  raise RuntimeError("source origin mismatch before import")
              module = importlib.import_module(name)
              validate_origin(module, expected)
              admitted_modules.append((module, expected))
          parser_module = importlib.import_module("logseq_matryca_parser")
          validate_origin(parser_module, parser_origin)

          for name in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT"):
              if not os.environ[name].isdigit():
                  raise RuntimeError("invalid run identity")
          identity = {
              "head": head,
              "tree": tree,
              "workflow_sha": workflow_sha,
              "workflow_ref": workflow_ref,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "python": platform.python_version(),
              "parser": parser_distribution.version,
              "pytest": importlib.metadata.version("pytest"),
              "parser_origin": "logseq_matryca_parser/__init__.py",
              "origins": [str(expected.relative_to(root)) for _, expected in admitted_modules],
              "selected_files": observed_files,
          }
          print("OG_BOOTSTRAP_ADMISSION " + json.dumps(identity, sort_keys=True), flush=True)

          import pytest

          class DiagnosticEvidence:
              def __init__(self):
                  self.collected = False
                  self.reports = {}

              def pytest_collection_finish(self, session):
                  for module, expected in admitted_modules:
                      validate_origin(module, expected)
                  validate_case_ids([item.nodeid for item in session.items])
                  if any(list(item.iter_markers(name="xfail")) for item in session.items):
                      raise RuntimeError("xfail marker is not admitted")
                  self.collected = True

              def pytest_runtest_logreport(self, report):
                  self.reports.setdefault(report.nodeid, []).append(
                      (report.when, report.outcome, hasattr(report, "wasxfail"))
                  )

          evidence = DiagnosticEvidence()
          result = pytest.main(
              ["-n", "0", "-vv", "-o", "addopts=", "--tb=short", *SELECTORS],
              plugins=[evidence],
          )
          if result != 0 or not evidence.collected:
              raise SystemExit(int(result) or 1)
          validate_reports(evidence.reports)
          if selected_file_map() != observed_files or git_metadata("rev-parse", "HEAD") != head:
              raise RuntimeError("source changed during diagnostic")
          for module, expected in admitted_modules:
              validate_origin(module, expected)
          validate_origin(parser_module, parser_origin)
          print(
              "OG_BOOTSTRAP_RESULT "
              + json.dumps({"status": "PASS", "cases": evidence.reports, "identity": identity}, sort_keys=True),
              flush=True,
          )
          PY

  ironclad-gatekeeper:
    name: Ironclad Gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - dependency-review
      - python-312-quality
      - frontend-quality
      - python-313-compatibility
      - shadow-cross-platform
    steps:
      - name: Require every applicable qualification lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          PYTHON_312_RESULT: ${{ needs.python-312-quality.result }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          PYTHON_313_RESULT: ${{ needs.python-313-compatibility.result }}
          SHADOW_RESULT: ${{ needs.shadow-cross-platform.result }}
        run: |
          set -euo pipefail
          test "$PYTHON_312_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$PYTHON_313_RESULT" = success
          test "$SHADOW_RESULT" = success
          if test "$EVENT_NAME" = pull_request; then
            test "$DEPENDENCY_REVIEW_RESULT" = success
          else
            test "$DEPENDENCY_REVIEW_RESULT" = skipped
          fi
