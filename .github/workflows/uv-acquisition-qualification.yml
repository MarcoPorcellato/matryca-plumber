name: Qualification tool acquisition

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/og-public-artifact-qualification.yml"
      - ".github/workflows/uv-acquisition-qualification.yml"
      - "scripts/release_qualification/uv_acquisition.py"
      - "tests/test_release_uv_acquisition.py"
      - "tests/test_release_workflow_contract.py"
      - "tests/test_release_package_alpha1_public.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/og-public-artifact-qualification.yml"
      - ".github/workflows/uv-acquisition-qualification.yml"
      - "scripts/release_qualification/uv_acquisition.py"
      - "tests/test_release_uv_acquisition.py"
      - "tests/test_release_workflow_contract.py"
      - "tests/test_release_package_alpha1_public.py"

permissions:
  contents: read

concurrency:
  group: uv-acquisition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Acquire ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      MATRYCA_UV_ROOT: ${{ runner.temp }}/matryca-uv
      MATRYCA_UV_PLATFORM: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Acquire exact official uv
        id: acquire-uv
        timeout-minutes: 2
        shell: bash
        env:
          MATRYCA_UV_ROOT: ${{ runner.temp }}/matryca-uv
          MATRYCA_UV_PLATFORM: ${{ matrix.platform }}
          UV_PYTHON: "3.12"
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/matryca-uv/python
          UV_PYTHON_BIN_DIR: ${{ runner.temp }}/matryca-uv/python-bin
          UV_ARCHIVE_SHA256: "${{ matrix.platform == 'macos-arm64' && 'a9a8df1eedeb192f2e47e40e2faabfb387db4b850209118786d42f89dde3e0ba' || matrix.platform == 'windows-x64' && '6dbb02d79e419522f1c500f0adb1cddcff0cda7d59b0d66ea7f5e3b4a1b2f5f0' || '23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8' }}"
        run: |
          set -euo pipefail
          python -I -B scripts/release_qualification/uv_acquisition.py acquire --root "$MATRYCA_UV_ROOT" --runner-temp "$RUNNER_TEMP" --platform "$MATRYCA_UV_PLATFORM" > /dev/null
          printf 'MATRYCA_UV_ROOT=%s\nMATRYCA_UV_PLATFORM=%s\nUV_PYTHON=3.12\nUV_PYTHON_INSTALL_DIR=%s\nUV_PYTHON_BIN_DIR=%s\n' "$MATRYCA_UV_ROOT" "$MATRYCA_UV_PLATFORM" "$UV_PYTHON_INSTALL_DIR" "$UV_PYTHON_BIN_DIR" >> "$GITHUB_ENV"
          printf '%s\n%s\n' "$UV_PYTHON_BIN_DIR" "$MATRYCA_UV_ROOT/bin" >> "$GITHUB_PATH"
      - name: Verify selected uv acquisition
        id: setup-uv
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          test "$UV_PYTHON" = 3.12
          test "$UV_PYTHON_INSTALL_DIR" = "$MATRYCA_UV_ROOT/python"
          test "$UV_PYTHON_BIN_DIR" = "$MATRYCA_UV_ROOT/python-bin"
          python -I -B scripts/release_qualification/uv_acquisition.py verify --root "$MATRYCA_UV_ROOT" --runner-temp "$RUNNER_TEMP" --platform "$MATRYCA_UV_PLATFORM" > /dev/null
          selected="$MATRYCA_UV_ROOT/bin/uv"
          located="$(command -v uv)"
          if [ "$RUNNER_OS" = Windows ]; then
            selected="$(cygpath -u "$selected").exe"
            located="$(cygpath -u "$located")"
            case "$located" in *.exe) ;; *) located="$located.exe";; esac
          fi
          test -f "$selected" && test ! -L "$selected"
          selected="$(cd -P "$(dirname "$selected")" && pwd)/$(basename "$selected")"
          located="$(cd -P "$(dirname "$located")" && pwd)/$(basename "$located")"
          test "$selected" = "$located"
          observed="$("$selected" --version | awk '{print $1" "$2}')"
          test "$observed" = "uv 0.12.19"
          printf 'uv-path=%s\nuv-version=%s\n' "$selected" "${observed#uv }" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$observed"

      - name: Require refusal without another request
        id: repeat-acquisition
        timeout-minutes: 2
        run: |
          set -euo pipefail
          set +e
          python -I -B scripts/release_qualification/uv_acquisition.py acquire --root "$MATRYCA_UV_ROOT" --runner-temp "$RUNNER_TEMP" --platform "$MATRYCA_UV_PLATFORM" > "$RUNNER_TEMP/repeat.stdout" 2> "$RUNNER_TEMP/repeat.stderr"
          result=$?
          set -e
          test "$result" = 2
          test ! -s "$RUNNER_TEMP/repeat.stdout"
          test "$(cat "$RUNNER_TEMP/repeat.stderr")" = "uv acquisition error: root_not_fresh"
          printf 'refusal=PASS\n' >> "$GITHUB_OUTPUT"
      - name: Emit sanitized bootstrap evidence
        if: always()
        timeout-minutes: 2
        env:
          ACQUISITION_OUTCOME: ${{ steps.acquire-uv.outcome }}
          VERIFICATION_OUTCOME: ${{ steps.setup-uv.outcome }}
          REFUSAL_OUTCOME: ${{ steps.repeat-acquisition.outcome }}
          OBSERVED_UV_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
          REFUSAL_STATUS: ${{ steps.repeat-acquisition.outputs.refusal }}
        run: |
          set -euo pipefail
          if [ "$ACQUISITION_OUTCOME" = success ] && [ "$VERIFICATION_OUTCOME" = success ] && [ "$REFUSAL_OUTCOME" = success ]; then
            test "$OBSERVED_UV_VERSION" = 0.12.19
            test "$REFUSAL_STATUS" = PASS
            python -I -B scripts/release_qualification/uv_acquisition.py verify --root "$MATRYCA_UV_ROOT" --runner-temp "$RUNNER_TEMP" --platform "$MATRYCA_UV_PLATFORM" | python -I -B -c 'import json,os,sys; r=json.load(sys.stdin); observed=os.environ["OBSERVED_UV_VERSION"]; refusal=os.environ["REFUSAL_STATUS"]; assert observed=="0.12.19" and refusal=="PASS"; result={k:r[k] for k in ("expected_version","source","asset","archive_sha256","archive_bytes","executable_sha256")}; result.update(status="PASS",acquisition="PASS",verification="PASS",observed_version=observed,existing_root_refusal=refusal); print(json.dumps(result,sort_keys=True))' > "$RUNNER_TEMP/bootstrap-report.json"
          else
            python -I -B -c 'import json,os; names=("ACQUISITION_OUTCOME","VERIFICATION_OUTCOME","REFUSAL_OUTCOME"); values=[os.environ[n] for n in names]; assert all(v in {"success","failure","skipped","cancelled"} for v in values); states=["PASS" if v=="success" else "NOT_RUN" if v=="skipped" else "FAIL" for v in values]; result=dict(zip(("acquisition","verification","existing_root_refusal"),states,strict=True)); result["status"]="FAIL"; print(json.dumps(result,sort_keys=True))' > "$RUNNER_TEMP/bootstrap-report.json"
          fi
          cat "$RUNNER_TEMP/bootstrap-report.json"
      - name: Preserve sanitized bootstrap evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: uv-acquisition-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bootstrap-report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
