          test "$("$selected" --version | awk '{print $1" "$2}')" = "uv 0.12.19"
          printf 'uv_archive_sha256=%s\nuv_executable_sha256=%s\n' "$UV_ARCHIVE_SHA256" "$executable_sha256"
      - name: Provision explicit qualification interpreters
        timeout-minutes: 5
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: manual
        run: uv python install 3.12 "${RUNTIME_MINOR:-3.12}"
      - name: Provision locked qualification tools
        shell: bash
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/tools" uv sync --locked --extra dev --no-install-project --no-config --no-python-downloads --link-mode copy
      - name: Download independently bound canonical artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.admission.outputs.artifact-id }}
          path: ${{ runner.temp }}/bundle
          merge-multiple: true
          digest-mismatch: error
      - name: Run mapped exact-source negative controls
        timeout-minutes: 16
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/bin/python" -B scripts/qualify_release_package.py alpha-source-controls --source-root "$GITHUB_WORKSPACE" --dist-dir "$RUNNER_TEMP/bundle/dist" --python "$RUNNER_TEMP/tools/bin/python" --work "$RUNNER_TEMP/source-controls-work" --output "$RUNNER_TEMP/source-results/source.json"
      - name: Preserve source-controls evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: og-public-${{ github.run_id }}-${{ github.run_attempt }}-source-controls
          path: ${{ runner.temp }}/source-results
          if-no-files-found: error
          retention-days: 14
          compression-level: 0


