name: OG public artifact qualification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Separately activated exact public alpha source commit"
        type: string
        required: true
      publication_run:
        description: "Complete successful tag-push publication run R, attempt one"
        type: string
        required: true

permissions: {}

env:
  SELECTED_SOURCE: ${{ inputs.source_sha }}
  PUBLICATION_RUN: ${{ inputs.publication_run }}
  PYTHONDONTWRITEBYTECODE: "1"
  UV_NO_CONFIG: "1"
  UV_PYTHON_DOWNLOADS: never
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: og-public-${{ inputs.source_sha }}-${{ inputs.publication_run }}
  cancel-in-progress: false

jobs:
  admission:
    name: Admit public OG alpha
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      attestations: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-sha256: ${{ steps.upload.outputs.artifact-digest }}
      binding: ${{ steps.admit.outputs.binding_json }}
      build-json: ${{ steps.admit.outputs.build_json }}
      public-json: ${{ steps.admit.outputs.public_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require the activated exact main attempt
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = MarcoPorcellato/matryca-plumber
          test "$GITHUB_REPOSITORY_ID" = 1241185104
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$SELECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PUBLICATION_RUN" =~ ^[1-9][0-9]*$ ]]
          test "$SELECTED_SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SELECTED_SOURCE"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Prepare fresh uv acquisition root
        shell: bash
        timeout-minutes: 2
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/alpha-uv-tool-cache
        run: |
          set -euo pipefail
          cache="$RUNNER_TOOL_CACHE"
          if [ "$RUNNER_OS" = Windows ]; then cache="$(cygpath -u "$cache")"; fi
          test ! -e "$cache"
          test ! -L "$cache"
          mkdir -m 700 "$cache"
      - name: Install pinned uv
        id: setup-uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        timeout-minutes: 2
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/alpha-uv-tool-cache
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: false
          download-from-astral-mirror: false
          checksum: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
      - name: Verify selected uv acquisition
        shell: bash
        timeout-minutes: 2
        env:
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/alpha-uv-tool-cache
          UV_SELECTED_PATH: ${{ steps.setup-uv.outputs.uv-path }}
          UV_SELECTED_VERSION: ${{ steps.setup-uv.outputs.uv-version }}
          UV_ARCHIVE_SHA256: "23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8"
        run: |
          set -euo pipefail
          cache="$RUNNER_TOOL_CACHE"
          selected="$UV_SELECTED_PATH"
          located="$(command -v uv)"
          if [ "$RUNNER_OS" = Windows ]; then
            cache="$(cygpath -u "$cache")"
            selected="$(cygpath -u "$selected")"
            located="$(cygpath -u "$located")"
            case "$selected" in *.exe) ;; *) selected="$selected.exe";; esac
            case "$located" in *.exe) ;; *) located="$located.exe";; esac
          fi
          test -d "$cache" && test ! -L "$cache"
          test -f "$selected" && test ! -L "$selected" && test -x "$selected"
          test -f "$located" && test ! -L "$located"
          cache="$(cd -P "$cache" && pwd)"
          selected="$(cd -P "$(dirname "$selected")" && pwd)/$(basename "$selected")"
          located="$(cd -P "$(dirname "$located")" && pwd)/$(basename "$located")"
          case "$selected" in "$cache"/*) ;; *) exit 1;; esac
          test "$selected" = "$located"
          test "$UV_SELECTED_VERSION" = 0.12.19
          if [ "$RUNNER_OS" = macOS ]; then
            executable_sha256="$(shasum -a 256 "$selected" | awk '{print $1}')"
          else
            executable_sha256="$(sha256sum "$selected" | awk '{print $1}')"
          fi
          [[ "$executable_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$("$selected" --version | awk '{print $1" "$2}')" = "uv 0.12.19"
          printf 'uv_archive_sha256=%s\nuv_executable_sha256=%s\n' "$UV_ARCHIVE_SHA256" "$executable_sha256"
      - name: Provision explicit qualification interpreter
        timeout-minutes: 5
        env:
          UV_PYTHON_DOWNLOADS: manual
        run: uv python install 3.12
      - name: Provision locked qualification tools without project installation
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/tools" uv sync --locked --extra dev --no-install-project --no-config --no-python-downloads --link-mode copy
      - name: Admit only the actual public original pair and provenance
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/bin/python" -B scripts/qualify_release_package.py alpha-public-admit --source-root "$GITHUB_WORKSPACE" --publication-run "$PUBLICATION_RUN" --output "$RUNNER_TEMP/bundle"
      - name: Preserve public admission evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: og-public-${{ github.run_id }}-${{ github.run_attempt }}-admission
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

