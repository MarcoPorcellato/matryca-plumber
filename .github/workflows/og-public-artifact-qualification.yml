          selected="$(cd -P "$(dirname "$selected")" && pwd)/$(basename "$selected")"
          located="$(cd -P "$(dirname "$located")" && pwd)/$(basename "$located")"
          case "$selected" in "$cache"/*) ;; *) exit 1;; esac
          test "$selected" = "$located"
          test "$UV_SELECTED_VERSION" = 0.12.19
          if [ "$RUNNER_OS" = macOS ]; then
