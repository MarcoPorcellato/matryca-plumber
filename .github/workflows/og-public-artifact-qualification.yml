            executable_sha256="$(shasum -a 256 "$selected" | awk '{print $1}')"
          else
            executable_sha256="$(sha256sum "$selected" | awk '{print $1}')"
          fi
          [[ "$executable_sha256" =~ ^[0-9a-f]{64}$ ]]
          test "$("$selected" --version | awk '{print $1" "$2}')" = "uv 0.12.19"
          printf 'uv_archive_sha256=%s\nuv_executable_sha256=%s\n' "$UV_ARCHIVE_SHA256" "$executable_sha256"
      - name: Provision explicit qualification interpreters
        timeout-minutes: 5
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: manual
        run: uv python install 3.12 "${RUNTIME_MINOR:-3.12}"
      - name: Provision locked qualification tools
        shell: bash
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/tools" uv sync --locked --extra dev --no-install-project --no-config --no-python-downloads --link-mode copy
      - name: Require actual upstream jobs and retained artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/bin/python" -c 'import json,os; value=json.loads(os.environ["NEEDS_JSON"]); assert len(value)==7 and all(job["result"]=="success" for job in value.values())'
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" > "$RUNNER_TEMP/current-main.json"
          "$RUNNER_TEMP/tools/bin/python" -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/current-main.json"))["object"]["sha"]==os.environ["SELECTED_SOURCE"]'
      - name: Download only the seven independently carried artifact IDs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: "${{ needs.admission.outputs.artifact-id }},${{ needs.source-controls.outputs.artifact-id }},${{ needs.windows-refusal.outputs.artifact-id }},${{ needs.linux312.outputs.artifact-id }},${{ needs.linux313.outputs.artifact-id }},${{ needs.macos312.outputs.artifact-id }},${{ needs.macos313.outputs.artifact-id }}"
          path: ${{ runner.temp }}/downloaded
          merge-multiple: false
          digest-mismatch: error
      - name: Fail-closed public alpha aggregation
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tools/bin/python" -B scripts/qualify_release_package.py alpha-public-aggregate --source-root "$GITHUB_WORKSPACE" --receipt-dir "$RUNNER_TEMP/downloaded" --jobs "$RUNNER_TEMP/jobs.json" --artifacts "$RUNNER_TEMP/artifacts.json" --output "$RUNNER_TEMP/alpha-aggregate.json"
      - name: Preserve public aggregate (not consumer admission)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: og-public-${{ github.run_id }}-${{ github.run_attempt }}-aggregate
          path: ${{ runner.temp }}/alpha-aggregate.json
          if-no-files-found: error
          retention-days: 14

