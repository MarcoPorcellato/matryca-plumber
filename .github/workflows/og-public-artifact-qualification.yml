  linux312:
    name: OG linux-x64 Python 3.12
    needs: admission
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-sha256: ${{ steps.upload.outputs.artifact-digest }}
